# @created 2026-10-11
# @description 在 QNAP 上运行隔离数据目录的 OpenLucky 服务。
# @author yunhungo
services:
  app:
    image: ${OPENLUCKY_IMAGE:?OPENLUCKY_IMAGE is required}
    container_name: openlucky
    restart: unless-stopped
    network_mode: host
    environment:
      OPENLUCKY_DATA: /data
      OPENLUCKY_FRONTEND: /app/frontend
      OPENLUCKY_ADMIN_ADDR: ${OPENLUCKY_ADMIN_ADDR:-127.0.0.1:56002}
      OPENLUCKY_HTTP_ADDR: ${OPENLUCKY_HTTP_ADDR:-[::]:58081}
      OPENLUCKY_HTTPS_ADDR: ${OPENLUCKY_HTTPS_ADDR:-[::]:58444}
      OPENLUCKY_PUBLIC_HTTPS_PORT: ${OPENLUCKY_PUBLIC_HTTPS_PORT:-58444}
      OPENLUCKY_HTTP3_ADDR: ${OPENLUCKY_HTTP3_ADDR:-}
      OPENLUCKY_PUBLIC_HTTP3_PORT: ${OPENLUCKY_PUBLIC_HTTP3_PORT:-}
      OPENLUCKY_LISTENERS: ${OPENLUCKY_LISTENERS:-[]}
      OPENLUCKY_ACCESS_DAYS: ${OPENLUCKY_ACCESS_DAYS:-7}
      OPENLUCKY_ACCESS_ROWS: ${OPENLUCKY_ACCESS_ROWS:-20000}
      OPENLUCKY_SECURE_COOKIE: ${OPENLUCKY_SECURE_COOKIE:-false}
    volumes:
      - ${OPENLUCKY_ROOT:?OPENLUCKY_ROOT is required}/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    # 文件能力只授予绑定低端口；进程仍为 UID 10001，其余能力全部移除。
    security_opt: ["no-new-privileges:false"]
    stop_grace_period: 40s
    mem_limit: 384m
    cpus: 1.5
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent "http://$${OPENLUCKY_ADMIN_ADDR}/healthz"']
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
